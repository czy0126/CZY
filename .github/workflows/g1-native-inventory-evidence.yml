name: G1-native-inventory-read-only-capture-preflight
on:
  push:
    paths:
      - 'hardware/dcx_main/g1/export_native_inventory.py'
      - 'hardware/dcx_main/g1/g1_native_inventory_raw.json'
      - 'hardware/dcx_main/g1/g1_native_inventory_bom_gate.json'
      - 'hardware/dcx_main/gen/read_native_inventory.js'
      - 'tools/native_inventory_bom_gate.py'
      - 'tools/test_native_inventory_bom_gate.py'
      - 'tools/test_g1_native_inventory_export.py'
      - 'tools/g1_schematic_pcb_alignment.py'
      - 'tools/test_g1_schematic_pcb_alignment.py'
      - 'hardware/dcx_main/g1/g1_schematic_pcb_alignment.json'
      - 'hardware/dcx_main/g1/lr_repack_readback.json'
      - 'hardware/dcx_main/g1/lr_repack_drc_raw.json'
      - 'hardware/dcx_main/g1/dcx_main_board_g1_lr_repack.eprj2'
      - 'hardware/dcx_main/gen/netlist_export_raw.json'
      - '.gitattributes'
      - '.github/workflows/g1-native-inventory-evidence.yml'
  pull_request:
    paths:
      - 'hardware/dcx_main/g1/export_native_inventory.py'
      - 'hardware/dcx_main/g1/g1_native_inventory_raw.json'
      - 'hardware/dcx_main/g1/g1_native_inventory_bom_gate.json'
      - 'hardware/dcx_main/gen/read_native_inventory.js'
      - 'tools/native_inventory_bom_gate.py'
      - 'tools/test_native_inventory_bom_gate.py'
      - 'tools/test_g1_native_inventory_export.py'
      - 'tools/g1_schematic_pcb_alignment.py'
      - 'tools/test_g1_schematic_pcb_alignment.py'
      - 'hardware/dcx_main/g1/g1_schematic_pcb_alignment.json'
      - 'hardware/dcx_main/g1/lr_repack_readback.json'
      - 'hardware/dcx_main/g1/lr_repack_drc_raw.json'
      - 'hardware/dcx_main/g1/dcx_main_board_g1_lr_repack.eprj2'
      - 'hardware/dcx_main/gen/netlist_export_raw.json'
      - '.gitattributes'
      - '.github/workflows/g1-native-inventory-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captured-g1-inventory-still-reads-as-renamed-dnp-not-fab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-derive both audits and prove the G1 capture is still fail-closed
        run: |
          python -m pip install 'pytest>=8,<10'
          # The default candidate still audits the Nov 6 main-board snapshot.
          python tools/native_inventory_bom_gate.py --check
          # The G1 report must reproduce from the committed capture.
          python tools/native_inventory_bom_gate.py --check \
            --inventory hardware/dcx_main/g1/g1_native_inventory_raw.json \
            --out hardware/dcx_main/g1/g1_native_inventory_bom_gate.json
          python tools/g1_schematic_pcb_alignment.py --check
          python -m pytest -q tools/test_native_inventory_bom_gate.py \
            tools/test_g1_native_inventory_export.py tools/test_g1_schematic_pcb_alignment.py \
            tools/test_d1_fabrication_gate.py
