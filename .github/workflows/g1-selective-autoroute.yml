name: G1 one-shot native selective signal autorouter fail-closed
on:
  pull_request:
    paths:
      - 'hardware/dcx_main/g1/apply_g1_control_autoroute.py'
      - 'hardware/dcx_main/g1/apply_g1_open_batch.py'
      - 'tools/test_g1_control_autoroute.py'
      - 'hardware/dcx_main/g1/lr_signal_review_readback.json'
      - '.github/workflows/g1-selective-autoroute.yml'
  push:
    branches: [feat/d1-fab-package]
    paths:
      - 'hardware/dcx_main/g1/apply_g1_control_autoroute.py'
      - 'tools/test_g1_control_autoroute.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_control_router_source_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no power or Kelvin net can be silently autorouted
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tools/test_g1_open_batch.py tools/test_g1_control_autoroute.py
      - name: Emit exact native EasyEDA selected-net autorouting body
        run: |
          python hardware/dcx_main/g1/apply_g1_control_autoroute.py --check > g1_control_autoroute_scope.json
          python hardware/dcx_main/g1/apply_g1_control_autoroute.py --emit-js > g1_control_autoroute_native.js
          python - <<'PY'
          import json
          d=json.load(open("g1_control_autoroute_scope.json",encoding="utf-8"))
          s=open("g1_control_autoroute_native.js",encoding="utf-8").read()
          assert len(d["routing_nets"])==8
          assert len(d["ignoring_nets"])==57
          assert "RoutingNets: allow" in s
          assert "ignoreNets: excluded" in s
          assert "layers: [1]" in s
          assert "autoRouting();" not in s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G1-source-hashed-8-net-EasyEDA-beta-autorouter-NOT_FOR_FAB
          path: |
            g1_control_autoroute_scope.json
            g1_control_autoroute_native.js
          if-no-files-found: error
          retention-days: 30
# CI cannot run proprietary Windows EasyEDA: this is an executable input,
# not native layout or actual improvement from the 199 open connections.
