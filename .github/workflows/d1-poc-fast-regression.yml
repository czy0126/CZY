name: D1-PoC-fast-regression-no-simulator
on:
  push:
    paths:
      - 'tools/run_poc_low_current.py'
      - 'tools/poc_early_solver_diagnostics.py'
      - 'tools/test_run_poc_low_current.py'
      - 'tools/test_poc_early_solver_diagnostics.py'
      - '.github/workflows/d1-poc-fast-regression.yml'
  pull_request:
    paths:
      - 'tools/run_poc_low_current.py'
      - 'tools/poc_early_solver_diagnostics.py'
      - 'tools/test_run_poc_low_current.py'
      - 'tools/test_poc_early_solver_diagnostics.py'
      - '.github/workflows/d1-poc-fast-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source + fail-closed solver-output tests (not actual LTspice)
        run: |
          python -m pip install 'pytest>=8,<10'
          python tools/poc_low_current_decks.py --check
          python -m pytest -q \
            tools/test_poc_low_current_decks.py \
            tools/test_poc_early_solver_diagnostics.py \
            tools/test_run_poc_low_current.py \
            tools/test_poc_real_run_gate.py \
            tools/test_poc_simulation_failure_modes.py \
            tools/test_poc_raw_evidence.py \
            tools/test_ltspice_batch_smoke.py
