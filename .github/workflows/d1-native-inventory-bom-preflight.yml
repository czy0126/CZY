name: D1-native-inventory-BOM-field-preflight
on:
  pull_request:
    paths:
      - 'tools/native_inventory_bom_gate.py'
      - 'tools/test_native_inventory_bom_gate.py'
      - 'hardware/dcx_main/native_inventory_bom_gate.json'
      - '.github/workflows/d1-native-inventory-bom-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-native-inventory-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - run: |
          python tools/native_inventory_bom_gate.py --check
          python -m pytest -q tools/test_native_inventory_bom_gate.py
