name: D1-staged-RFQ-and-100A-interface-preflight
on:
  push:
    paths:
      - 'tools/performance_first_design.py'
      - 'tools/test_performance_first_design.py'
      - 'design/v3/power_priority/high_margin_design_gate.json'
      - 'hardware/dcx_main/performance_first_component_rfq.csv'
      - '.github/workflows/d1-staged-rfq-preflight.yml'
  pull_request:
    paths:
      - 'tools/performance_first_design.py'
      - 'tools/test_performance_first_design.py'
      - 'design/v3/power_priority/high_margin_design_gate.json'
      - 'hardware/dcx_main/performance_first_component_rfq.csv'
      - '.github/workflows/d1-staged-rfq-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-rfq-not-supplier-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-recompute and stage-specific RFQ regression
        run: |
          python -m pip install 'pytest>=8,<10'
          python tools/output_loop_joint_redesign.py --check
          python tools/performance_first_design.py
          python -m pytest -q tools/test_performance_first_design.py tools/test_output_loop_joint_redesign.py
