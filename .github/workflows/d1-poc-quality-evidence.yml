name: D1-PoC-record-quality-no-raw
on:
  push:
    paths:
      - 'tools/poc_low_current_quality.py'
      - 'tools/test_poc_low_current_quality.py'
      - 'sim/v3/poc_*_comparison_model_only.json'
      - '.github/workflows/d1-poc-quality-evidence.yml'
  pull_request:
    paths:
      - 'tools/poc_low_current_quality.py'
      - 'tools/test_poc_low_current_quality.py'
      - 'sim/v3/poc_*_comparison_model_only.json'
      - '.github/workflows/d1-poc-quality-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-record-postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 5A/10A committed record only (never hardware release)
        run: |
          python -m pip install 'pytest>=8,<10'
          python tools/poc_low_current_quality.py --check
          python -m pytest -q tools/test_poc_low_current_quality.py
