name: D1-39-BOM-oem-catalog-repair-plan
on:
  pull_request:
    paths:
      - 'tools/verified_catalog_candidates.py'
      - 'tools/test_verified_catalog_candidates.py'
      - 'hardware/dcx_main/verified_catalog_candidates_not_for_fab.json'
      - 'hardware/dcx_main/native_inventory_bom_gate.json'
      - '.github/workflows/d1-bom-oem-catalog-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-catalog-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - run: |
          python tools/verified_catalog_candidates.py --check
          python -m pytest -q tools/test_verified_catalog_candidates.py
