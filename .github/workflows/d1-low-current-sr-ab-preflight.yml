name: d1-low-current-sr-ab-preflight

on:
  pull_request:
    paths:
      - 'tools/poc_low_current_decks.py'
      - 'tools/test_poc_low_current_decks.py'
      - 'tools/run_poc_low_current.py'
      - 'tools/test_run_poc_low_current.py'
      - 'sim/v3/poc_5a_sr_on.cir'
      - 'sim/v3/poc_5a_sr_off.cir'
      - 'sim/v3/poc_10a_sr_on.cir'
      - 'sim/v3/poc_10a_sr_off.cir'
      - 'sim/v3/sr_tank_dual_v33_cold_phys.cir'
      - '.github/workflows/d1-low-current-sr-ab-preflight.yml'
  workflow_dispatch:

jobs:
  exact-source-and-body-diode-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - name: Check all 4 cold-start model snapshots against current D1 source
        run: |
          python tools/poc_low_current_decks.py --check
          python -m pytest -q tools/test_poc_low_current_decks.py tools/test_run_poc_low_current.py
          python tools/run_poc_low_current.py --check
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import poc_low_current_decks as p
          report=p.manifest()
          assert report['config']['power_stage_power_on_authorized'] is False
          assert all(c['LTspice_simulated'] is False for c in report['cases'].values())
          print('Four equivalent D1 low-current PoC decks; not simulated nor hardware approved')
          PY

# Source/algorithm validation ONLY. This runner has no LTspice and cannot
# qualify any gate clamp, diode thermal load, current limit or 100A PCB.
