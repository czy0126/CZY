name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      # Raws are not in Git by design; the suite skips the one test that stats
      # the 424 MB ledger raw, and ci_check tolerates absent raw entries.
      - run: python tools/ci_check.py
