name: D1-native-mpn-preflight
on:
  pull_request:
    paths:
      - 'tools/native_mpn_value_conflicts.py'
      - 'tools/test_native_mpn_value_conflicts.py'
      - 'hardware/dcx_main/native_mpn_value_conflicts.json'
      - '.github/workflows/d1-native-mpn-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-backed-mpn-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - run: |
          python tools/native_mpn_value_conflicts.py --check
          python -m pytest -q tools/test_native_mpn_value_conflicts.py
