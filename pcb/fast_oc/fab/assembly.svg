  <text class="note" x="22" y="114">Scale 1:1 at A4. All 26 placements are on F.Cu (top side); the board is single-sided assembly.</text>
  <text class="note" x="22" y="119">0 parts are DNP -- hatched red, marked on the board and listed in red below. Their lands stay bare; they are excluded from the position file.</text>
  <text class="note" x="22" y="124">Not an approval: hardware_built and fabrication_approved are false. DRC covers copper only -- no thermal, EMC or first-article review has been done.</text>
  <text class="note" x="22" y="129">Footprints are vendored from hardware/stock_footprints (sha256 in PROVENANCE.md). This module has no datasheet-drawn land pattern.</text>
